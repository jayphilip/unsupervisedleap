baseURL = 'https://jayphilip.github.io/unsupervisedleap/'
languageCode = 'en-us'
title = 'Unsupervised Leap'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  defaultTheme = 'dark'
  description = "A blog about fatherhood, artificial intelligence, and the questions worth asking."
  author = "Jason Albert"
  authorBio = "Writing about fatherhood, artificial intelligence, and the questions worth asking. Pattern recognition, one post at a time."
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "No labels. No loss function."
    Content = """
Welcome to **Unsupervised Leap** — dispatches from the unstructured space \
between being a dad, thinking about AI, and wondering what any of it means. \
No supervised training here. Just pattern recognition, one post at a time.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourusername"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false

